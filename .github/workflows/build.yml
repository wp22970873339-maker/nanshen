name: Build 3DS CIA Calculator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Packaging Tools from GitHub
        run: |
          wget -q https://github.com/Steveice10/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -q bannertool.zip -d /tmp/
          mv /tmp/linux-x86_64/bannertool /usr/local/bin/
          chmod +x /usr/local/bin/bannertool

          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip
          unzip -q makerom-*.zip -d /usr/local/bin/
          chmod +x /usr/local/bin/makerom

      - name: Build Project
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          make

      - name: Package CIA
        run: |
          bannertool makesmdh -s "Calculator" -l "Apple Calculator" -p "Dev" -o icon.bin
          makerom -f cia -o apple-calc.cia -elf apple-calc.elf -icon icon.bin

      - name: Upload CIA File
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Calculator-New3DS
          path: |
            *.cia
            *.3dsx
            *.elf
