name: Build 3DS CIA Calculator
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Packaging Tools
        run: |
          set -e
          curl -fL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          unzip -q makerom.zip -d /tmp/makerom
          chmod +x /tmp/makerom/makerom
          mv /tmp/makerom/makerom /usr/local/bin/makerom
          rm -rf makerom.zip /tmp/makerom
          curl -fL -o /usr/local/bin/bannertool https://github.com/Steveice10/bannertool/releases/download/1.1.0/bannertool-linux
          chmod +x /usr/local/bin/bannertool
          makerom -v || true
          bannertool --version || true
      - name: Build Project
        run: |
          make
      - name: Package CIA
        run: |
          bannertool makesmdh -s "Calculator" -l "Apple Calculator" -p "Dev" -o icon.bin
          makerom -f cia -o apple-calc.cia -elf apple-calc.elf -icon icon.bin
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Calculator-New3DS
          path: |
            *.3dsx
            *.cia
            *.elf
