name: Build 3DS Homebrew

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Switch to Community Mirror and Install 3DS SDK
        run: |
          # 1. 替换官方源为社区镜像源，彻底绕过 devkitpro.org 的 403 封锁
          sed -i 's|https://pkg.devkitpro.org/packages|https://wii.leseratte10.de/devkitPro/pacman/packages|g' /opt/devkitpro/pacman/etc/pacman.d/* || true
          sed -i 's|https://downloads.devkitpro.org/packages|https://wii.leseratte10.de/devkitPro/pacman/packages|g' /opt/devkitpro/pacman/etc/pacman.d/* || true

          # 2. 安装 3DS 全套开发套件，自动回答所有交互问题
          yes | dkp-pacman -Sy --noconfirm --needed 3ds-dev

      - name: Compile Project
        run: |
          # 加载 devkitPro 环境变量
          export DEVKITPRO=/opt/devkitpro
          . /etc/profile.d/devkit-env.sh || true
          export PATH=$DEVKITPRO/tools/bin:$DEVKITPRO/devkitARM/bin:$PATH
          
          make clean || true
          make

      - name: Upload 3DSX File
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Calculator-3DSX
          path: |
            *.3dsx
            *.smdh
